services:
  # --- Dashboard API (FastAPI + DuckDB + Athena) ---
  api:
    build: ./api
    container_name: api
    restart: unless-stopped
    environment:
      # Where the lake is inside this container (mounted below).
      LAKE_DIR: /opt/data/lake
      AWS_DEFAULT_REGION: us-west-2
    # dashboard-reader's AWS keys, from a private file that exists only on the
    # server (git-ignored). required: false so `docker compose config` still
    # works on machines without it, like the Mac.
    env_file:
      - path: .env.dashboard
        required: false
    volumes:
      # Read-only: the public-facing API can never change the lake.
      - ./data:/opt/data:ro
    # No ports: only Caddy (same Docker network) can reach it.

  # --- Dashboard web server (Caddy + built React app) ---
  web:
    build: ./frontend
    container_name: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    # Step 7.4: local only, for testing through an SSH tunnel.
    # Step 7.5 changes this to public ports 80 and 443.
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      # Caddy stores its HTTPS certificates here, so they survive restarts.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  # --- Airflow metadata database (run history, task states) ---
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow   # not reachable from outside: no ports exposed
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data

  # --- Airflow: scheduler + DAG processor + web UI, all in one ---
  airflow:
    build: ./phase6
    container_name: airflow
    restart: unless-stopped
    # Run as the host user that owns ~/.aws (so Airflow can read the chmod 600
    # credentials). The ID differs between machines (1001 on the Oracle VM), so
    # it comes from AIRFLOW_UID in a per-machine .env file; 1000 if unset.
    user: "${AIRFLOW_UID:-1000}:0"
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AWS_DEFAULT_REGION: us-west-2
      # Point the AWS CLI and boto3 straight at the mounted files, so they don't
      # depend on $HOME (which differs when running as uid 1000).
      AWS_SHARED_CREDENTIALS_FILE: /home/airflow/.aws/credentials
      AWS_CONFIG_FILE: /home/airflow/.aws/config
    volumes:
      # Your DAG files
      - ./phase6/dags:/opt/airflow/dags
      # The whole repo, read-only: scripts + the lake for sync and freshness
      - .:/opt/project:ro
      # pipeline-vm's AWS credentials, read-only
      - ~/.aws:/home/airflow/.aws:ro
    # Kafka UI already uses 8080 on the host, so expose Airflow on 8081
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - airflow-postgres

  # --- Message broker ---
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    # Restart after crashes and server reboots (unless stopped on purpose).
    restart: unless-stopped
    environment:
      # KRaft mode: this one container acts as both broker and controller,
      # so no separate Zookeeper service is needed.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094
      # Two advertised listeners: one for other containers on the Docker
      # network (kafka:9092), one for scripts running on the host (localhost:9094).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Store messages in the named volume below, so they survive the
      # container being removed or the image being updated.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    # 127.0.0.1 = reachable only from this machine, never from the internet.
    ports:
      - "127.0.0.1:9094:9094"

  # --- Web UI for Kafka (reach it through an SSH tunnel) ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # --- Producer: polls NOAA + USGS every minute, sends to Kafka ---
  producer:
    # Built from phase1/Dockerfile instead of pulled from Docker Hub.
    build: ./phase1
    container_name: producer
    restart: unless-stopped
    environment:
      # Inside Docker, Kafka is reached at its internal address.
      BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka

  # --- Streaming job: weather (parse, dedupe, z-score detection, write lake) ---
  weather-stream:
    image: apache/spark:4.1.1-python3
    container_name: weather-stream
    # Root so Spark can write to the mounted folders (local-dev shortcut).
    user: root
    restart: unless-stopped
    working_dir: /opt/app
    # The same spark-submit command you used to type by hand. Each job gets its
    # own ivy sub-folder so the two don't fight over the download cache.
    command: >
      /opt/spark/bin/spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1
      --conf spark.jars.ivy=/opt/ivy/weather
      --conf spark.log.level=WARN
      weather_stream.py
    volumes:
      - ./phase2:/opt/app
      - ./data:/opt/data
      - ivy-cache:/opt/ivy
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - kafka

  # --- Streaming job: seismic (parse, dedupe, magnitude flag, write lake) ---
  seismic-stream:
    image: apache/spark:4.1.1-python3
    container_name: seismic-stream
    user: root
    restart: unless-stopped
    working_dir: /opt/app
    command: >
      /opt/spark/bin/spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1
      --conf spark.jars.ivy=/opt/ivy/seismic
      --conf spark.log.level=WARN
      seismic_stream.py
    volumes:
      - ./phase2:/opt/app
      - ./data:/opt/data
      - ivy-cache:/opt/ivy
    # Each container has its own port 4040 inside; map this one to 4041 outside.
    ports:
      - "127.0.0.1:4041:4040"
    depends_on:
      - kafka

  # --- Spare Spark container for ad-hoc pyspark shells (docker exec) ---
  spark:
    image: apache/spark:4.1.1-python3
    container_name: spark
    user: root
    command: sleep infinity
    restart: unless-stopped
    working_dir: /opt/app
    volumes:
      - ./phase2:/opt/app
      - ./data:/opt/data
      - ivy-cache:/opt/ivy

volumes:
  ivy-cache:
  # Kafka's message storage; survives container removal.
  kafka-data:
  # Airflow's run history.
  airflow-db:
  # Caddy's certificates and settings.
  caddy-data:
  caddy-config:

