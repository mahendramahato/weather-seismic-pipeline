services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    environment:
      # KRaft mode: this one container acts as both broker and controller,
      # so no separate Zookeeper service is needed.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094
      # Two advertised listeners: one for other containers on the Docker
      # network (kafka:9092), one for our Python scripts running on the
      # host machine (localhost:9094).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  spark:
    image: apache/spark:4.1.1-python3
    container_name: spark
    user: root
    command: sleep infinity
    working_dir: /opt/app
    volumes:
      - ./phase2:/opt/app
      - ./data:/opt/data
      - ivy-cache:/opt/ivy
    ports:
      - "4040:4040"
    depends_on:
      - kafka

volumes:
  ivy-cache:
